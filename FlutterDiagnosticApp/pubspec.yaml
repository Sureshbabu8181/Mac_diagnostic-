name: mac_diagnostic
description: "Offline hardware & system diagnostics for Android and Windows."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  device_info_plus: ^11.2.0
  battery_plus: ^6.0.2
  connectivity_plus: ^6.1.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  permission_handler: ^11.3.1
  camera: ^0.11.0
  record: ^7.0.0
  audioplayers: ^6.1.0
  share_plus: ^10.1.2
  disk_space_plus: ^0.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  msix: ^3.18.0

flutter:
  uses-material-design: true

msix_config:
  display_name: MAC Diagnostic Center
  publisher_display_name: MAC Diagnostic
  identity_name: com.macdiagnostic.mac_diagnostic
  publisher: CN=MAC Diagnostic, O=MAC Diagnostic, C=US
  msix_version: 1.0.0.0
  logo_path: windows/runner/resources/app_icon.ico
  capabilities: internetClient, microphone, camera
  languages: en-us
  file_extension:
    - .mdix
